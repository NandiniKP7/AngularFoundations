<div class="product">
  <img [src]="getImageUrl(product)" [alt]="product.name"/>
  <div class="details">
    <div>
      <h2>{{product.name}}</h2>
      <p>{{product.description}}</p>
      <p>{{availableInventory}}</p>
      <p>Category Type: {{product.category}}</p>
    </div>
  </div>
  <div class="price">
    <p>${{product.price}}</p>
    <button class="cta" (click)="addToCart(product,$event)">Buy</button>
    <button class="cta" (click)="false">DoNothing</button>
  </div>
</div>
